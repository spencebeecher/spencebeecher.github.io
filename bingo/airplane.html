<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>✈️</text></svg>">
    <title>Airplane Bingo!</title>
    <style>
        body {
            background-image: url(./airplane.png);
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        /* Add some basic styling width: 100%;*/
        table {
            border-collapse: collapse;
            width: 380px;
            height: 400px;
            margin: auto;
            margin-left: 0; /* Align table to the left */
            padding-left: 3px; /* Add padding to the left */
            padding-right: 3px; /* Add padding to the right */
            table-layout: fixed; /* Ensure equal width for all cells */
        }
        
        td {
            border: 1px solid #000;
            width: 20%; 
            height: 18%; /* Ensure equal height for all rows */
            text-align: center;
            vertical-align: middle;
            font-size: 13px;
            font-family: Arial, sans-serif;
            border-right: 1px solid #000;
            background-color: white; /* Set cell background to white */
        }
        .header-row td {
            height: auto; /* Allow the header row to have auto height */
            font-size: 35px;
            font-weight: bold;
            color: #000; /* Set text color to black */
        }
        
        
        .marked {
            background-color: #1976D2;
        }
        .wild {
            background-color: #B388EB; /* wild squares: same colour in every game */
        }
        #wild-tracker {
            display: inline-block;
            font-family: Arial, sans-serif;
            font-size: 1.15em;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 8px;
            background: #B388EB;
            color: #000;
            margin-bottom: 18px;
        }
        #copy-emojis,
        #generate-board,
        #add-wild,
        button[onclick] {
            font-size: 1.15em;      /* Slightly smaller font */
            padding: 10px 22px;     /* Slightly less padding */
            border-radius: 8px;
            font-weight: bold;
            background: #1976D2;
            color: #fff;
            border: none;
            cursor: pointer;
            margin-bottom: 18px;
            transition: background 0.2s, box-shadow 0.2s;
        }
        #copy-emojis:hover,
        #generate-board:hover,
        #add-wild:hover,
        button[onclick]:hover {
            background: #1976D2;
            box-shadow: 0 0 6px #888;
        }
    </style>
</head>
<body>
    <button id="generate-board">Refresh</button>
    <button id="copy-emojis">Share</button>
    <!-- Add button to go to index.html -->
    <button onclick="resetBoardAndNavigate('index.html')">
        Games
    </button>
    <button id="add-wild">🃏 Add Wild</button>
    <span id="wild-tracker">Wilds: <span id="wild-count">0</span></span>

    <script>
        function resetBoardAndNavigate(page) {
            // Clear this game's marks and the user id cookies
            document.cookie = "bingo-airplane.html=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            document.cookie = "user-id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location.href = page;
        }
    </script>
    <table id="bingo-board">
        <!-- ...existing code... -->
        <!-- Generate a 5x5 Bingo board -->
        <tr class="header-row">
            <td>B</td><td>I</td><td>N</td><td>G</td><td>O</td>
        </tr>
        <!-- ...existing code... -->
        <!-- Add rows for numbers -->
        <tr>
            <td class="cell">1</td><td class="cell">16</td><td class="cell">31</td><td class="cell">46</td><td class="cell">61</td>
        </tr>
        <tr>
            <td class="cell">2</td><td class="cell">17</td><td class="cell">32</td><td class="cell">47</td><td class="cell">62</td>
        </tr>
        <tr>
            <td class="cell">3</td><td class="cell">18</td><td class="cell">33</td><td class="cell">48</td><td class="cell">63</td>
        </tr>
        <tr>
            <td class="cell">4</td><td class="cell">19</td><td class="cell">34</td><td class="cell">49</td><td class="cell">64</td>
        </tr>
        <tr>
            <td class="cell">5</td><td class="cell">20</td><td class="cell">35</td><td class="cell">50</td><td class="cell">65</td>
        </tr>
    </table>
    <script>
        const colorSchemes = {
            default: ['#1976D2', '#4FC3F7', '#ECEFF1', '#FF8A65', '#FFD54F'],
        };

        const tropesList = {
            default: ['Sweatpants Outnumber Jeans', 'Giant Tumbler Cup Spotted', 'Floor Camping at an Outlet', 'Bags Saving a Whole Row', '$18 Sad Sandwich', 'Neck Pillow in the Food Court', 'Group 9 Crowds the Gate', 'Boarding Pass Reminder on Repeat', 'Food Court Feast Boards the Plane', 'Stern ‘Tray Tables Up’ Reminder', 'Overhead Bin Tetris', '‘We’re Boarding Now!’ Phone Call', 'Asleep Before the Safety Demo', 'Bathroom Rush at the Ding', 'Flight Map Stare-Down', 'Pilot Says ‘Folks’ Twice', 'Drink Cart Traffic Jam', 'Ear-Popping Face Yoga', 'Coffee Line Longer Than Security', 'Dramatic Sigh at the Delay Board', 'Vacation Shirt Already On', 'Olympic Sprint to the Gate', 'Frantic Pocket Pat-Down', 'Same Name Paged Twice', 'Walkway Blocker, Both Lanes', 'Crew Struts By in Slow Motion', 'Kid Narrates Every Plane', 'Beeping Cart Parts the Crowd', 'Half the Plane Is Group 1', 'Plane Selfie, Take 12', 'Backpack Bonks an Aisle Head', 'Jacket Gets Its Own Bin', '‘Would You Mind Switching?’', 'Late Passenger Walk of Shame', 'Filming the Whole Takeoff', 'Instant Recline at Wheels-Up', 'Flashlight Hunt for a Lost Earbud', 'Full Hoodie Cocoon Mode', 'Seatbelt Sign? Never Heard of It', 'Baby Stares Into Your Soul', 'Recliner Lands in Your Lap', 'Armrest Elbow Jousting', 'Aisle Climb-Over Gymnastics', 'Mouth-Wide-Open Sleeper', 'Window Seat Wasted on a Napper', 'Angry Laptop Typing', 'Seatmate Reads Your Screen', 'Full Tray-Table Deep Clean', 'Jiggling the Occupied Lav Door', 'Pilot Promises to ‘Make Up Time’', 'Pilot Has the Radio-DJ Voice', 'PA Sounds Like a Kazoo', 'Credit Card Pitch Mid-Nap', 'Bumpy Air: Drinks Do the Wave', 'Pretzel Bag With 7 Pretzels', 'Tomato Juice (Why?)', '‘Can I Get the Whole Can?’', 'Wi-Fi Stuck on Loading', 'Outlet Is Just Decorative', 'Cabin Turns Into a Freezer', 'Air Vent Hurricane', 'Obligatory Wing Photo', 'Gate Change Stampede', 'Holey Socks at Security', 'Wrestling a Bag Into the Sizer', 'Delay Grows 15 Minutes at a Time', 'Voucher Bidding War', 'Starfish Sleeper at the Gate', 'Margarita Before 9 a.m.', 'Bride Squad in Sashes', 'Cowboy Hat Needs Its Own Seat', 'Dog in a Carrier Judging You', 'Kid Rides a Suitcase Like a Pony', 'Yoga by the Gate', 'Confidently in the Wrong Seat', 'Window Shade Wars', 'Taxi Ride Feels Like a Road Trip', 'Kid Yells ‘Wheee!’ on Takeoff', 'Baby Solo, Then a Duet', 'Seat Kicker Keeps the Beat', 'Bare Feet on the Armrest', 'Socks-Only Bathroom Trip', 'Snores Like a Leaf Blower', 'Sleepy Head on a Stranger', 'Movie Blasting, No Earbuds', 'Phone Brightness Set to ‘Sun’', 'Neighbor’s Movie Spoils Yours', 'Hair Waterfall Over Your Seat', 'Tuna Sandwich Unleashed', 'Seatmate Shares Life Story', 'Brought Their Whole Bed', '‘Are We There Yet?’', 'Toddler Greets Every Row', 'Water Bottle Rolls Down the Aisle', 'Shade Opens, Everyone Hisses', 'Pilot Dad Joke', 'Whole Plane Leans to Look', 'Cabin Sings Happy Birthday', 'Seatbelt Ding Mid-Pour', 'Holding Pattern Loop-de-Loop', 'Coffee Splash Zone', 'Flight Attendant Zinger', 'Cloud Shaped Like a Dog', 'Another Plane Zooms By', 'Sunset Worth 40 Photos'],
        };

        // Optional tiers: squares that happen nearly every time (sure) and most
        // of the time (likely). Everything else in tropesList is wild. Games
        // without tiers keep the plain shuffled card.
        const sureTropes = ['Sweatpants Outnumber Jeans', 'Giant Tumbler Cup Spotted', 'Floor Camping at an Outlet', 'Bags Saving a Whole Row', '$18 Sad Sandwich', 'Neck Pillow in the Food Court', 'Group 9 Crowds the Gate', 'Boarding Pass Reminder on Repeat', 'Food Court Feast Boards the Plane', 'Stern ‘Tray Tables Up’ Reminder', 'Overhead Bin Tetris', '‘We’re Boarding Now!’ Phone Call', 'Asleep Before the Safety Demo', 'Bathroom Rush at the Ding', 'Flight Map Stare-Down', 'Pilot Says ‘Folks’ Twice', 'Drink Cart Traffic Jam', 'Ear-Popping Face Yoga'];
        const likelyTropes = ['Coffee Line Longer Than Security', 'Dramatic Sigh at the Delay Board', 'Vacation Shirt Already On', 'Olympic Sprint to the Gate', 'Frantic Pocket Pat-Down', 'Same Name Paged Twice', 'Walkway Blocker, Both Lanes', 'Crew Struts By in Slow Motion', 'Kid Narrates Every Plane', 'Beeping Cart Parts the Crowd', 'Half the Plane Is Group 1', 'Plane Selfie, Take 12', 'Backpack Bonks an Aisle Head', 'Jacket Gets Its Own Bin', '‘Would You Mind Switching?’', 'Late Passenger Walk of Shame', 'Filming the Whole Takeoff', 'Instant Recline at Wheels-Up', 'Flashlight Hunt for a Lost Earbud', 'Full Hoodie Cocoon Mode', 'Seatbelt Sign? Never Heard of It', 'Baby Stares Into Your Soul', 'Recliner Lands in Your Lap', 'Armrest Elbow Jousting', 'Aisle Climb-Over Gymnastics', 'Mouth-Wide-Open Sleeper', 'Window Seat Wasted on a Napper', 'Angry Laptop Typing', 'Seatmate Reads Your Screen', 'Full Tray-Table Deep Clean', 'Jiggling the Occupied Lav Door', 'Pilot Promises to ‘Make Up Time’', 'Pilot Has the Radio-DJ Voice', 'PA Sounds Like a Kazoo', 'Credit Card Pitch Mid-Nap', 'Bumpy Air: Drinks Do the Wave', 'Pretzel Bag With 7 Pretzels', 'Tomato Juice (Why?)', '‘Can I Get the Whole Can?’', 'Wi-Fi Stuck on Loading', 'Outlet Is Just Decorative', 'Cabin Turns Into a Freezer', 'Air Vent Hurricane', 'Obligatory Wing Photo'];

        function applyColorScheme(scheme) {
            console.log('applyColorScheme');
            const colors = colorSchemes[scheme] || colorSchemes.default;
            const headerCells = document.querySelectorAll('.header-row td');
            console
            console.log('Colors:', colors);
            headerCells.forEach((cell, index) => {
                cell.style.backgroundColor = colors[index];
                console.log('Set header cell', index, 'to color', colors[index]);
            });
        }

        function getTropes(list) {
            return [...new Set(tropesList[list] || tropesList.default)];
        }

        function seededShuffle(array, s) {
            var seed = s + 1;
            for (let i = array.length - 1; i > 0; i--) {
                var x = Math.sin(seed++) * 10000;
                x = x - Math.floor(x);
                const j = Math.floor(x * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function hashString(str) {
            let hash = 0;
            for (let i = 0, len = str.length; i < len; i++) {
                let chr = str.charCodeAt(i);
                hash = (hash << 5) - hash + chr;
                hash |= 0; // Convert to 32bit integer
            }
            return hash;
        }

        function setCookie(name, value, days) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            //name = name + "-" + "airplane.html"; // Make cookie name unique per page
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function generateRandomUserId() {
            return 'user_' + Math.random().toString(36).substr(2, 9);
        }

        function getOrCreateUserId(reset) {
            let userId = getCookie('user-id');
            if (!userId || reset) {
                userId = generateRandomUserId();
                setCookie('user-id', userId, 7);
            }
            return userId;
        }

        // Lay out a tiered card so every line can realistically finish: one wild
        // square in each row and column, never on a diagonal, up to six sure
        // squares on the diagonals, and likely squares everywhere else.
        function dealCard(shuffled, seed) {
            if (!sureTropes.length && !likelyTropes.length) {
                return shuffled;
            }
            const sure = shuffled.filter(t => sureTropes.includes(t));
            const likely = shuffled.filter(t => likelyTropes.includes(t));
            const wild = shuffled.filter(t => !sureTropes.includes(t) && !likelyTropes.includes(t));

            // Each row's wild square goes in a different column, off both diagonals
            let cols = [0, 1, 2, 3, 4];
            for (let tries = 0; cols.some((c, r) => c === r || c === 4 - r); tries++) {
                if (tries > 500) { cols = [1, 0, 3, 4, 2]; break; }
                seededShuffle(cols, seed + tries);
            }
            const diagonals = [0, 6, 18, 24, 4, 8, 16, 20];
            seededShuffle(diagonals, seed);

            const card = new Array(25);
            card[12] = 'FREE';
            cols.forEach((c, r) => { card[r * 5 + c] = wild.pop() || likely.pop(); });
            diagonals.slice(0, 6).forEach(i => { card[i] = sure.pop() || likely.pop(); });
            for (let i = 0; i < 25; i++) {
                if (card[i] === undefined) card[i] = likely.pop() || sure.pop() || wild.pop();
            }
            return card;
        }

        function generateBoard() {
            const userId = getOrCreateUserId();
            console.log('User ID:', userId);
            
            const seed = hashString(userId);
            const shuffled = getTropes('default');
            seededShuffle(shuffled, seed);
            const christmasTropes = dealCard(shuffled, seed);

            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, index) => {
                if (index < christmasTropes.length) {
                    cell.textContent = christmasTropes[index];
                    if (index === 12) {
                        cell.textContent = 'FREE';
                        cell.classList.add('marked');
                    }
                }
            });
        }

        // Marks are saved per game, together with the card they were made on,
        // so a new card or another game never starts with squares highlighted.
        const stateCookie = 'bingo-airplane.html';

        function updateWildCount() {
            document.getElementById('wild-count').textContent =
                document.querySelectorAll('#bingo-board td.wild').length;
        }

        function saveCellColors() {
            console.log('saveCellColors');
            const cells = document.querySelectorAll('#bingo-board tr:not(.header-row) td');
            const marks = Array.from(cells).map(cell =>
                cell.classList.contains('wild') ? 'wild' : cell.classList.contains('marked') ? 'marked' : '');
            const state = { id: getOrCreateUserId(), marks: marks };
            setCookie(stateCookie, encodeURIComponent(JSON.stringify(state)), 7);
            updateWildCount();
        }

        function loadCellColors() {
            console.log('loadCellColors');
            // The old cookie was shared by every game; drop it
            document.cookie = "cell-colors=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            let state = {};
            try {
                state = JSON.parse(decodeURIComponent(getCookie(stateCookie) || '{}'));
            } catch (e) {
                state = {};
            }
            if (state.id === getOrCreateUserId() && Array.isArray(state.marks)) {
                const cells = document.querySelectorAll('#bingo-board tr:not(.header-row) td');
                cells.forEach((cell, index) => {
                    if (state.marks[index] === 'marked' || state.marks[index] === 'wild') {
                        cell.classList.add(state.marks[index]);
                    }
                });
            }
            updateWildCount();
        }

        // A wild highlights a random open square, in the wild colour
        function addWild() {
            const open = Array.from(document.querySelectorAll('#bingo-board td.cell'))
                .filter(cell => !cell.classList.contains('marked') && !cell.classList.contains('wild'));
            if (!open.length) {
                return;
            }
            open[Math.floor(Math.random() * open.length)].classList.add('wild');
            saveCellColors();
        }

        function copyBoardEmojis() {
            const cells = document.querySelectorAll('#bingo-board tr:not(.header-row) td');
            
            let boardEmojis = '';
            boardEmojis += 'Airplane Bingo!';

            boardEmojis += '\n';
            boardEmojis += '✈️🧳🛫☁️🛬';

            boardEmojis += '\n';
            cells.forEach((cell, index) => {
                if (index % 5 === 0 && index !== 0) {
                    boardEmojis += '\n';
                }
                boardEmojis += cell.classList.contains('wild') ? '🃏' : cell.classList.contains('marked') ? '✅' : '⬜';
            });
            const wilds = document.querySelectorAll('#bingo-board td.wild').length;
            if (wilds) {
                boardEmojis += '\n';
                boardEmojis += '🃏 Wilds used: ' + wilds;
            }
            
            boardEmojis += '\n';
            boardEmojis += 'https://spencebeecher.me/bingo/airplane.html';

            navigator.clipboard.writeText(boardEmojis).then(() => {
                alert('Copied to clipboard!');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyColorScheme('default');
            generateBoard();
            loadCellColors();
        });

        document.getElementById('generate-board').addEventListener('click', async () => {
            console.log('generate board click');
            getOrCreateUserId(true);
            const cells = document.querySelectorAll('#bingo-board tr:not(.header-row) td');
            cells.forEach((cell, index) => {
                cell.classList.remove('marked', 'wild');
            });
            generateBoard();
            saveCellColors();
        });

        document.getElementById('add-wild').addEventListener('click', addWild);

        document.getElementById('copy-emojis').addEventListener('click', copyBoardEmojis);

        document.querySelectorAll('#bingo-board tr:not(.header-row) td').forEach(cell => {
            cell.addEventListener('click', () => {
                console.log('cell click');
                if (cell.classList.contains('marked') || cell.classList.contains('wild')) {
                    cell.classList.remove('marked', 'wild');
                } else {
                    cell.classList.add('marked');
                }
                saveCellColors();
            });
        });
    </script>
    
</body>
</html>
