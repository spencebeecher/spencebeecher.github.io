<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>✈️</text></svg>">
    <title>Airplane Bingo!</title>
    <style>
        body {
            background-image: url(./airplane.png);
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        /* Add some basic styling width: 100%;*/
        table {
            border-collapse: collapse;
            width: 380px;
            height: 400px;
            margin: auto;
            margin-left: 0; /* Align table to the left */
            padding-left: 3px; /* Add padding to the left */
            padding-right: 3px; /* Add padding to the right */
            table-layout: fixed; /* Ensure equal width for all cells */
        }
        
        td {
            border: 1px solid #000;
            width: 20%; 
            height: 18%; /* Ensure equal height for all rows */
            text-align: center;
            vertical-align: middle;
            font-size: 13px;
            font-family: Arial, sans-serif;
            border-right: 1px solid #000;
            background-color: white; /* Set cell background to white */
        }
        .header-row td {
            height: auto; /* Allow the header row to have auto height */
            font-size: 35px;
            font-weight: bold;
            color: #000; /* Set text color to black */
        }
        
        
        .marked {
            background-color: #1976D2;
        }
        #copy-emojis,
        #generate-board,
        button[onclick] {
            font-size: 1.15em;      /* Slightly smaller font */
            padding: 10px 22px;     /* Slightly less padding */
            border-radius: 8px;
            font-weight: bold;
            background: #1976D2;
            color: #fff;
            border: none;
            cursor: pointer;
            margin-bottom: 18px;
            transition: background 0.2s, box-shadow 0.2s;
        }
        #copy-emojis:hover,
        #generate-board:hover,
        button[onclick]:hover {
            background: #1976D2;
            box-shadow: 0 0 6px #888;
        }
    </style>
</head>
<body>
    <button id="generate-board">Refresh</button>
    <button id="copy-emojis">Share</button>
    <!-- Add button to go to index.html -->
    <button onclick="resetBoardAndNavigate('index.html')">
        Games
    </button>

    <script>
        function resetBoardAndNavigate(page) {
            // Clear cell colors and user id cookies
            document.cookie = "cell-colors=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            document.cookie = "user-id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location.href = page;
        }
    </script>
    <table id="bingo-board">
        <!-- ...existing code... -->
        <!-- Generate a 5x5 Bingo board -->
        <tr class="header-row">
            <td>B</td><td>I</td><td>N</td><td>G</td><td>O</td>
        </tr>
        <!-- ...existing code... -->
        <!-- Add rows for numbers -->
        <tr>
            <td class="cell">1</td><td class="cell">16</td><td class="cell">31</td><td class="cell">46</td><td class="cell">61</td>
        </tr>
        <tr>
            <td class="cell">2</td><td class="cell">17</td><td class="cell">32</td><td class="cell">47</td><td class="cell">62</td>
        </tr>
        <tr>
            <td class="cell">3</td><td class="cell">18</td><td class="cell">33</td><td class="cell">48</td><td class="cell">63</td>
        </tr>
        <tr>
            <td class="cell">4</td><td class="cell">19</td><td class="cell">34</td><td class="cell">49</td><td class="cell">64</td>
        </tr>
        <tr>
            <td class="cell">5</td><td class="cell">20</td><td class="cell">35</td><td class="cell">50</td><td class="cell">65</td>
        </tr>
    </table>
    <script>
        const colorSchemes = {
            default: ['#1976D2', '#4FC3F7', '#ECEFF1', '#FF8A65', '#FFD54F'],
        };

        const tropesList = {
            default: ['Vacation Shirt Already On', 'Gate Change Stampede', 'Olympic Sprint to the Gate', 'Holey Socks at Security', 'Frantic Pocket Pat-Down', 'Wrestling a Bag Into the Sizer', 'Same Name Paged Twice', 'Delay Grows 15 Minutes at a Time', 'Voucher Bidding War', 'Starfish Sleeper at the Gate', 'Floor Camping at an Outlet', 'Bags Saving a Whole Row', 'Walkway Blocker, Both Lanes', 'Margarita Before 9 a.m.', '$18 Sad Sandwich', 'Neck Pillow in the Food Court', 'Bride Squad in Sashes', 'Cowboy Hat Needs Its Own Seat', 'Dog in a Carrier Judging You', 'Kid Rides a Suitcase Like a Pony', 'Crew Struts By in Slow Motion', 'Kid Narrates Every Plane', 'Beeping Cart Parts the Crowd', 'Group 9 Crowds the Gate', 'Half the Plane Is Group 1', 'Plane Selfie, Take 12', 'Yoga by the Gate', 'Backpack Bonks an Aisle Head', 'Stern ‘Tray Tables Up’ Reminder', 'Overhead Bin Tetris', 'Jacket Gets Its Own Bin', 'Confidently in the Wrong Seat', '‘Would You Mind Switching?’', '‘We’re Boarding Now!’ Phone Call', 'Asleep Before the Safety Demo', 'Window Shade Wars', 'Late Passenger Walk of Shame', 'Taxi Ride Feels Like a Road Trip', 'Filming the Whole Takeoff', 'Kid Yells ‘Wheee!’ on Takeoff', 'Flashlight Hunt for a Lost Earbud', 'Full Hoodie Cocoon Mode', 'Seatbelt Sign? Never Heard of It', 'Baby Solo, Then a Duet', 'Baby Stares Into Your Soul', 'Seat Kicker Keeps the Beat', 'Recliner Lands in Your Lap', 'Armrest Elbow Jousting', 'Aisle Climb-Over Gymnastics', 'Bare Feet on the Armrest', 'Socks-Only Bathroom Trip', 'Snores Like a Leaf Blower', 'Sleepy Head on a Stranger', 'Mouth-Wide-Open Sleeper', 'Window Seat Wasted on a Napper', 'Movie Blasting, No Earbuds', 'Phone Brightness Set to ‘Sun’', 'Angry Laptop Typing', 'Seatmate Reads Your Screen', 'Neighbor’s Movie Spoils Yours', 'Hair Waterfall Over Your Seat', 'Tuna Sandwich Unleashed', 'Full Tray-Table Deep Clean', 'Bathroom Rush at the Ding', 'Jiggling the Occupied Lav Door', 'Seatmate Shares Life Story', 'Flight Map Stare-Down', 'Brought Their Whole Bed', '‘Are We There Yet?’', 'Toddler Greets Every Row', 'Water Bottle Rolls Down the Aisle', 'Shade Opens, Everyone Hisses', 'Pilot Promises to ‘Make Up Time’', 'Pilot Says ‘Folks’ Twice', 'Pilot Has the Radio-DJ Voice', 'Pilot Dad Joke', 'PA Sounds Like a Kazoo', 'Credit Card Pitch Mid-Nap', 'Whole Plane Leans to Look', 'Cabin Sings Happy Birthday', 'Seatbelt Ding Mid-Pour', 'Bumpy Air: Drinks Do the Wave', 'Holding Pattern Loop-de-Loop', 'Drink Cart Traffic Jam', 'Pretzel Bag With 7 Pretzels', 'Tomato Juice (Why?)', '‘Can I Get the Whole Can?’', 'Coffee Splash Zone', 'Wi-Fi Stuck on Loading', 'Outlet Is Just Decorative', 'Ear-Popping Face Yoga', 'Cabin Turns Into a Freezer', 'Air Vent Hurricane', 'Flight Attendant Zinger', 'Obligatory Wing Photo', 'Cloud Shaped Like a Dog', 'Another Plane Zooms By', 'Sunset Worth 40 Photos'],
        };

        function applyColorScheme(scheme) {
            console.log('applyColorScheme');
            const colors = colorSchemes[scheme] || colorSchemes.default;
            const headerCells = document.querySelectorAll('.header-row td');
            console
            console.log('Colors:', colors);
            headerCells.forEach((cell, index) => {
                cell.style.backgroundColor = colors[index];
                console.log('Set header cell', index, 'to color', colors[index]);
            });
        }

        function getTropes(list) {
            return [...new Set(tropesList[list] || tropesList.default)];
        }

        function seededShuffle(array, s) {
            var seed = s + 1;
            for (let i = array.length - 1; i > 0; i--) {
                var x = Math.sin(seed++) * 10000;
                x = x - Math.floor(x);
                const j = Math.floor(x * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function hashString(str) {
            let hash = 0;
            for (let i = 0, len = str.length; i < len; i++) {
                let chr = str.charCodeAt(i);
                hash = (hash << 5) - hash + chr;
                hash |= 0; // Convert to 32bit integer
            }
            return hash;
        }

        function setCookie(name, value, days) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            //name = name + "-" + "airplane.html"; // Make cookie name unique per page
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function generateRandomUserId() {
            return 'user_' + Math.random().toString(36).substr(2, 9);
        }

        function getOrCreateUserId(reset) {
            let userId = getCookie('user-id');
            if (!userId || reset) {
                userId = generateRandomUserId();
                setCookie('user-id', userId, 7);
            }
            return userId;
        }

        function generateBoard() {
            const userId = getOrCreateUserId();
            console.log('User ID:', userId);
            
            const seed = hashString(userId);
            const christmasTropes = getTropes('default');
            seededShuffle(christmasTropes, seed);

            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, index) => {
                if (index < christmasTropes.length) {
                    cell.textContent = christmasTropes[index];
                    if (index === 12) {
                        cell.textContent = 'FREE';
                        cell.classList.add('marked');
                    }
                }
            });
        }

        function saveCellColors() {
            console.log('saveCellColors');
            const cells = document.querySelectorAll('#bingo-board tr:not(.header-row) td');
            const colors = Array.from(cells).map(cell => cell.classList.contains('marked') ? 'marked' : '');
            setCookie('cell-colors', JSON.stringify(colors), 7);
        }

        function loadCellColors() {
            console.log('loadCellColors');
            const colors = JSON.parse(getCookie('cell-colors') || '[]');
            const cells = document.querySelectorAll('#bingo-board tr:not(.header-row) td');
            cells.forEach((cell, index) => {
                if (colors[index] === 'marked') {
                    cell.classList.add('marked');
                }
            });
        }

        function copyBoardEmojis() {
            const cells = document.querySelectorAll('#bingo-board tr:not(.header-row) td');
            
            let boardEmojis = '';
            boardEmojis += 'Airplane Bingo!';

            boardEmojis += '\n';
            boardEmojis += '✈️🧳🛫☁️🛬';

            boardEmojis += '\n';
            cells.forEach((cell, index) => {
                if (index % 5 === 0 && index !== 0) {
                    boardEmojis += '\n';
                }
                boardEmojis += cell.classList.contains('marked') ? '✅' : '⬜';
            });
            
            boardEmojis += '\n';
            boardEmojis += 'https://spencebeecher.me/bingo/airplane.html';

            navigator.clipboard.writeText(boardEmojis).then(() => {
                alert('Copied to clipboard!');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyColorScheme('default');
            generateBoard();
            loadCellColors();
        });

        document.getElementById('generate-board').addEventListener('click', async () => {
            console.log('generate board click');
            getOrCreateUserId(true);
            const cells = document.querySelectorAll('#bingo-board tr:not(.header-row) td');
            cells.forEach((cell, index) => {
                cell.classList.remove('marked');
            });
            generateBoard();
            saveCellColors();
        });

        document.getElementById('copy-emojis').addEventListener('click', copyBoardEmojis);

        document.querySelectorAll('#bingo-board tr:not(.header-row) td').forEach(cell => {
            cell.addEventListener('click', () => {
                console.log('cell click');
                if (cell.classList.contains('marked')) {
                    cell.classList.remove('marked');
                } else {
                    cell.classList.add('marked');
                }
                saveCellColors();
            });
        });
    </script>
    
</body>
</html>
